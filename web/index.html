<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="游戏资料索引：分类浏览、检索与按需预览。">
  <title>藏经阁 · Game Wiki</title>
  <script>
    (() => {
      const saved = localStorage.getItem("wiki-theme");
      const preferred = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = saved === "dark" || saved === "light" ? saved : preferred;
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="masthead">
    <div class="nav-inner">
      <a class="brand" href="/" aria-label="藏经阁首页">
        <span class="brand-mark">藏</span>
        <span><strong>藏经阁</strong><small>GAME WIKI</small></span>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <a class="active" href="#archive">资料索引</a>
        <a href="#games">游戏分类</a>
        <a href="#about">关于项目</a>
      </nav>
      <div class="header-actions">
        <div class="source-note"><span class="pulse"></span> <span data-server="数据源在线" data-static="静态快照">数据源在线</span></div>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换深浅主题" aria-pressed="false">
          <span class="theme-icon" aria-hidden="true"></span>
          <span class="theme-label">深色</span>
        </button>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="hero">
      <div class="breadcrumb"><span>TOOLS</span><b>/</b><span>GAME ARCHIVE</span></div>
      <div class="hero-heading">
        <div>
          <p class="eyebrow">GAME RESOURCE ARCHIVE</p>
          <h1>游戏资料档案馆</h1>
          <p class="lede" data-server="索引、分类与检索本地游戏资料。源文件保持原位，仅在主动预览时读取单个受支持文件。" data-static="游戏资料的分类索引与检索。本页是构建时生成的静态快照，不含任何可执行的服务端逻辑。">索引、分类与检索本地游戏资料。源文件保持原位，仅在主动预览时读取单个受支持文件。</p>
        </div>
        <div class="hero-badge"><span data-server="LOCAL" data-static="PUBLIC">LOCAL</span><strong data-server="只读模式" data-static="静态快照">只读模式</strong><small data-server="READ ONLY MODE" data-static="STATIC SNAPSHOT">READ ONLY MODE</small></div>
      </div>
      <form id="searchForm" class="search" role="search">
        <label class="sr-only" for="searchInput">搜索资料</label>
        <input id="searchInput" autocomplete="off" placeholder="搜索文件名、路径或游戏…">
        <button type="submit">搜索 / SEARCH</button>
      </form>
      <div id="stats" class="stats" aria-live="polite"></div>
    </section>

    <section class="game-deck" aria-labelledby="gameDeckTitle">
      <div class="deck-heading">
        <div><span>QUICK ACCESS</span><h2 id="gameDeckTitle">游戏资料入口</h2></div>
        <p>按资料数量展示主要分类</p>
      </div>
      <div id="gameCards" class="game-cards"></div>
    </section>

    <section id="archive" class="workspace">
      <aside id="games" class="filters panel">
        <div class="section-heading"><span>01</span><h2>游戏分类</h2></div>
        <button class="filter active" data-game="">全部资料 <b id="allCount">—</b></button>
        <div id="gameList"></div>
        <div class="section-heading types"><span>02</span><h2>资料类型</h2></div>
        <div id="kinds" class="kind-grid"></div>
      </aside>

      <section class="results panel">
        <div class="results-head">
          <div><p id="resultKicker">全部馆藏</p><h2 id="resultTitle">最新资料</h2></div>
          <span id="resultCount">正在载入…</span>
        </div>
        <div id="fileList" class="file-list" aria-live="polite"></div>
        <div class="pager">
          <button id="prevPage" type="button">← 上一页</button>
          <span id="pageInfo"></span>
          <button id="nextPage" type="button">下一页 →</button>
        </div>
      </section>
    </section>

    <footer id="about" class="site-footer">
      <div><strong>藏经阁 · GAME WIKI</strong><span>本地游戏资料索引工具</span></div>
      <p data-server="元数据只读扫描 · 单文件按需预览 · 原始数据不做修改" data-static="构建时生成静态快照 · 无服务端逻辑 · 原始数据不做修改">元数据只读扫描 · 单文件按需预览 · 原始数据不做修改</p>
    </footer>
  </main>

  <dialog id="previewDialog">
    <div class="dialog-head">
      <div><small>按需预览</small><h2 id="previewTitle"></h2></div>
      <button id="closePreview" aria-label="关闭预览">×</button>
    </div>
    <div id="previewBody" class="preview-body"></div>
  </dialog>

  <script src="/app.js" defer></script>
</body>
</html>
